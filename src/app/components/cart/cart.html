<app-navbar></app-navbar>

<div class="cart-page py-5">
    <div class="container">
        <div class="d-flex align-items-center mb-4">
            <i class="fa-solid fa-cart-shopping fs-3 text-warning me-3"></i>
            <h2 class="fw-bold mb-0">Shopping Cart</h2>
        </div>

        <!-- Cart with Items -->
        <div *ngIf="cartItems.length > 0">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden cart-card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 cart-table">
                        <thead>
                            <tr>
                                <th class="ps-4">Product</th>
                                <th>Price</th>
                                <th class="text-center">Quantity</th>
                                <th>Subtotal</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of cartItems">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center">
                                        <img [src]="item.imageUrl" [alt]="item.productName"
                                            class="rounded-3 me-3 cart-product-img">
                                        <span class="fw-semibold product-name">{{ item.productName }}</span>
                                    </div>
                                </td>
                                <td class="text-nowrap">₹{{ item.price | number:'1.2-2' }}</td>
                                <td>
                                    <div class="d-flex align-items-center justify-content-center">
                                        <button class="btn btn-outline-secondary btn-sm qty-btn"
                                            (click)="decreaseQuantity(item)" [disabled]="item.quantity <= 1">
                                            <i class="fa-solid fa-minus"></i>
                                        </button>
                                        <span class="mx-3 fw-bold qty-display">{{ item.quantity }}</span>
                                        <button class="btn btn-outline-secondary btn-sm qty-btn"
                                            (click)="increaseQuantity(item)">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </td>
                                <td class="fw-bold text-warning text-nowrap">₹{{ item.subtotal | number:'1.2-2' }}</td>
                                <td class="text-center">
                                    <button class="btn btn-outline-danger btn-sm rounded-circle remove-btn"
                                        (click)="removeItem(item.productId)" title="Remove item">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="row mt-4">
                <div class="col-md-6">
                    <button class="btn btn-outline-light me-2" (click)="continueShopping()">
                        <i class="fa-solid fa-arrow-left me-2"></i>Continue Shopping
                    </button>
                    <button class="btn btn-outline-danger" (click)="clearCart()">
                        <i class="fa-solid fa-trash me-2"></i>Clear Cart
                    </button>
                </div>
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4 summary-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fs-5 fw-semibold">Grand Total</span>
                            <span class="fs-4 fw-bold text-warning">₹{{ grandTotal | number:'1.2-2' }}</span>
                        </div>
                        <button class="btn btn-warning w-100 py-3 fw-bold rounded-3 checkout-btn"
                            (click)="proceedToCheckout()">
                            <i class="fa-solid fa-lock me-2"></i>Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty Cart -->
        <div *ngIf="cartItems.length === 0" class="text-center py-5">
            <div class="empty-cart-icon mb-4">
                <i class="fa-solid fa-cart-shopping fa-4x text-muted"></i>
            </div>
            <h4 class="fw-bold mb-3">Your cart is empty</h4>
            <p class="text-muted mb-4">Looks like you haven't added any products yet.</p>
            <button class="btn btn-warning px-4 py-2 fw-bold rounded-3" (click)="continueShopping()">
                <i class="fa-solid fa-bag-shopping me-2"></i>Start Shopping
            </button>
        </div>
    </div>
</div>

<app-footer></app-footer>
