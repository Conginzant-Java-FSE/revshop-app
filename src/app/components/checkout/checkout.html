<div class="checkout-page py-5">
    <div class="container">
        <h2 class="fw-bold mb-4">Checkout</h2>

        <div *ngIf="loading()" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="row g-4" *ngIf="!loading()">
            <div class="col-lg-8">
                <!-- Shipping Address -->
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-location-dot me-2 text-primary"></i> Shipping Address
                    </h5>

                    <div class="address-list" *ngIf="addresses().length > 0">
                        <div class="form-check address-card p-3 border rounded-3 mb-2" *ngFor="let addr of addresses()"
                            [class.border-primary]="selectedAddressId() === addr.addressId">
                            <input class="form-check-input" type="radio" [id]="'addr' + addr.addressId"
                                [value]="addr.addressId" [(ngModel)]="selectedAddressId" name="address">
                            <label class="form-check-label w-100 ms-2" [for]="'addr' + addr.addressId">
                                <span class="fw-bold d-block">{{ addr.addressLine }}</span>
                                <span class="small text-muted">{{ addr.city }}, {{ addr.state }} - {{ addr.zipCode
                                    }}</span>
                            </label>
                        </div>
                    </div>

                    <div *ngIf="addresses().length === 0" class="text-center py-3">
                        <p class="text-muted mb-3">No saved addresses found.</p>
                        <button class="btn btn-outline-primary btn-sm rounded-pill px-3">Add New Address</button>
                    </div>
                </div>

                <!-- Payment Method -->
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-credit-card me-2 text-primary"></i> Payment Method
                    </h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-check payment-card p-3 border rounded-3 text-center"
                                [class.border-primary]="paymentMethod() === 'CREDIT_CARD'">
                                <input class="form-check-input d-none" type="radio" id="payCC" value="CREDIT_CARD"
                                    [(ngModel)]="paymentMethod" name="payment">
                                <label class="form-check-label w-100" for="payCC">
                                    <i class="fa-solid fa-credit-card fs-3 mb-2 d-block"></i>
                                    <span class="fw-bold">Credit/Debit Card</span>
                                </label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check payment-card p-3 border rounded-3 text-center"
                                [class.border-primary]="paymentMethod() === 'PAYPAL'">
                                <input class="form-check-input d-none" type="radio" id="payPP" value="PAYPAL"
                                    [(ngModel)]="paymentMethod" name="payment">
                                <label class="form-check-label w-100" for="payPP">
                                    <i class="fa-brands fa-paypal fs-3 mb-2 d-block"></i>
                                    <span class="fw-bold">PayPal</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Summary Sticky -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 100px;">
                    <h5 class="fw-bold mb-4">Order Summary</h5>

                    <div class="order-items mb-4">
                        <div class="d-flex justify-content-between mb-2 small" *ngFor="let item of cart()?.items">
                            <span class="text-muted">{{ item.quantity }}x {{ item.productName }}</span>
                            <span class="fw-bold">₹{{ item.subtotal }}</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-bold">₹{{ cart()?.totalPrice }}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <h5 class="fw-bold">Total</h5>
                        <h5 class="fw-bold text-primary">₹{{ cart()?.totalPrice }}</h5>
                    </div>

                    <button class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm py-3 fw-bold"
                        (click)='placeOrder()'>
                        Place Order
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
