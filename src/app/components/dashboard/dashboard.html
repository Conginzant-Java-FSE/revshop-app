<div class="container min-vh-100 py-5">
    <div class="row min-vh-100 justify-content-center align-items-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5 text-center">

                    <div class="mb-4">
                        <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center text-primary"
                            style="width: 80px; height: 80px;">
                            <i class="fa-solid fa-user-check fs-1"></i>
                        </div>
                    </div>

                    <h2 class="fw-bold mb-3">Welcome, {{ userName }}!</h2>

                    <div class="alert alert-info rounded-3 mb-4" role="alert">
                        <i class="fa-solid fa-circle-info me-2"></i>
                        You are successfully authenticated as a <strong>{{ userRole }}</strong>.
                    </div>

                    <p class="text-muted mb-5">
                        This is a secure dashboard. Only authenticated users can access this page.
                    </p>

                    <button class="btn btn-danger btn-lg px-5 rounded-pill shadow-sm" (click)="onLogout()">
                        <i class="fa-solid fa-right-from-bracket me-2"></i> Log Out
                    </button>

                </div>
            </div>
        </div>
    </div>
</div>
