<section class="py-5 bg-light">
    <div class="container py-4">
        <div class="text-center mb-5">
            <h6 class="text-warning fw-bold text-uppercase tracking-wide mb-2">Shop by Category</h6>
            <h2 class="display-6 fw-bold text-dark">Trending Collections</h2>
            <div class="divider bg-warning mx-auto mt-3"></div>
        </div>

        <div class="row g-4 justify-content-center">
            <!-- Category 1 -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div
                    class="card category-card border-0 h-100 shadow-sm rounded-4 overflow-hidden text-center position-relative">
                    <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
                        <div class="icon-circle bg-primary bg-opacity-10 text-primary mb-3">
                            <i class="fa-solid fa-laptop fs-2"></i>
                        </div>
                        <h5 class="fw-bold fs-5 mb-1">Electronics</h5>
                        <p class="text-muted small mb-0">120+ Products</p>
                    </div>
                    <a [routerLink]="['/products']" [queryParams]="{search: 'Electronics'}" class="stretched-link"></a>
                </div>
            </div>

            <!-- Category 2 -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div
                    class="card category-card border-0 h-100 shadow-sm rounded-4 overflow-hidden text-center position-relative">
                    <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
                        <div class="icon-circle bg-success bg-opacity-10 text-success mb-3">
                            <i class="fa-solid fa-shirt fs-2"></i>
                        </div>
                        <h5 class="fw-bold fs-5 mb-1">Fashion</h5>
                        <p class="text-muted small mb-0">350+ Products</p>
                    </div>
                    <a [routerLink]="['/products']" [queryParams]="{search: 'Fashion'}" class="stretched-link"></a>
                </div>
            </div>

            <!-- Category 3 -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div
                    class="card category-card border-0 h-100 shadow-sm rounded-4 overflow-hidden text-center position-relative">
                    <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
                        <div class="icon-circle bg-danger bg-opacity-10 text-danger mb-3">
                            <i class="fa-solid fa-couch fs-2"></i>
                        </div>
                        <h5 class="fw-bold fs-5 mb-1">Home & Living</h5>
                        <p class="text-muted small mb-0">85+ Products</p>
                    </div>
                    <a [routerLink]="['/products']" [queryParams]="{search: 'Home'}" class="stretched-link"></a>
                </div>
            </div>

            <!-- Category 4 -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div
                    class="card category-card border-0 h-100 shadow-sm rounded-4 overflow-hidden text-center position-relative">
                    <div class="card-body p-4 d-flex flex-column align-items-center justify-content-center">
                        <div class="icon-circle bg-warning bg-opacity-10 text-warning mb-3">
                            <i class="fa-solid fa-dumbbell fs-2"></i>
                        </div>
                        <h5 class="fw-bold fs-5 mb-1">Sports</h5>
                        <p class="text-muted small mb-0">210+ Products</p>
                    </div>
                    <a [routerLink]="['/products']" [queryParams]="{search: 'Sports'}" class="stretched-link"></a>
                </div>
            </div>
        </div>
    </div>
</section>
