<div class="login-page min-vh-100 d-flex align-items-center py-5">
    <div class="container">
        <!-- Back Button -->
        <div class="mb-3">
            <a routerLink="/login" class="btn btn-outline-secondary rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Login
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white p-4 text-center border-0">
                        <h3 class="mb-0 fw-bold">Forgot Password</h3>
                        <p class="mb-0 text-white-50 small">Reset your account access</p>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- Step 1: Email Input -->
                        <div *ngIf="step() === 1">
                            <form [formGroup]="emailForm" (ngSubmit)="fetchQuestion()">
                                <div class="form-floating mb-4">
                                    <input type="email" class="form-control" id="email" formControlName="email"
                                        placeholder="name@example.com"
                                        [ngClass]="{'is-invalid': submitted() && emailForm.get('email')?.errors}">
                                    <label for="email">Email address</label>
                                    <div class="invalid-feedback">A valid email is required</div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3"
                                    [disabled]="loading()">
                                    <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
                                    Get Security Question
                                </button>
                            </form>
                        </div>

                        <!-- Step 2: Security Question & New Password -->
                        <div *ngIf="step() === 2">
                            <div class="alert alert-info rounded-3 mb-4">
                                <small class="text-uppercase fw-bold d-block mb-1">Security Question:</small>
                                <strong>{{ securityQuestion() }}</strong>
                            </div>

                            <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="securityAnswer"
                                        formControlName="securityAnswer" placeholder="Security Answer"
                                        [ngClass]="{'is-invalid': submitted() && resetForm.get('securityAnswer')?.errors}">
                                    <label for="securityAnswer">Your Answer</label>
                                    <div class="invalid-feedback">Security answer is required</div>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="newPassword"
                                        formControlName="newPassword" placeholder="New Password"
                                        [ngClass]="{'is-invalid': submitted() && resetForm.get('newPassword')?.errors}">
                                    <label for="newPassword">New Password</label>
                                    <div class="invalid-feedback">Password must be at least 8 characters</div>
                                </div>

                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control" id="confirmPassword"
                                        formControlName="confirmPassword" placeholder="Confirm Password"
                                        [ngClass]="{'is-invalid': submitted() && resetForm.errors?.['mismatch']}">
                                    <label for="confirmPassword">Confirm Password</label>
                                    <div class="invalid-feedback">Passwords do not match</div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3"
                                    [disabled]="loading()">
                                    <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
                                    Update Password
                                </button>
                            </form>
                        </div>

                    </div>
                    <div class="card-footer bg-light p-4 text-center border-0">
                        <p class="mb-0 text-muted small">Remember your password? <a routerLink="/login"
                                class="text-primary fw-bold text-decoration-none">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
