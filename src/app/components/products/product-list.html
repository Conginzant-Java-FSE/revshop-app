<div class="product-discovery py-5">
    <div class="container">
        <div class="row">
            <!-- Filters Sidebar -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                    <h5 class="fw-bold mb-4">Filters</h5>

                    <div class="mb-4">
                        <label class="form-label small text-muted text-uppercase fw-bold">Search</label>
                        <div class="input-group">
                            <input type="text" class="form-control border-end-0" placeholder="Search..."
                                [(ngModel)]="keyword" (keyup.enter)="onSearch()">
                            <button class="btn btn-outline-secondary border-start-0" (click)="onSearch()">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small text-muted text-uppercase fw-bold">Price Range</label>
                        <div class="d-flex align-items-center gap-2">
                            <input type="number" class="form-control" placeholder="Min" [(ngModel)]="minPrice">
                            <span>-</span>
                            <input type="number" class="form-control" placeholder="Max" [(ngModel)]="maxPrice">
                        </div>
                        <button class="btn btn-primary w-100 mt-3 rounded-pill" (click)="onFilter()">Apply
                            Filter</button>
                    </div>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0">Our Products</h4>
                    <span class="text-muted">{{ products().length }} Products Found</span>
                </div>

                <div *ngIf="loading()" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <div *ngIf="!loading() && products().length === 0" class="text-center py-5">
                    <i class="fa-solid fa-box-open fs-1 text-muted mb-3 d-block"></i>
                    <p class="text-muted">No products found matching your criteria.</p>
                </div>

                <div class="row g-4" *ngIf="!loading()">
                    <div class="col-md-6 col-xl-4" *ngFor="let product of products()">
                        <div
                            class="product-card card h-100 border-0 shadow-sm rounded-4 overflow-hidden position-relative">
                            <div
                                class="product-badge bg-primary text-white position-absolute px-3 py-1 rounded-pill small m-3">
                                New
                            </div>
                            <img [src]="product.imageUrl || 'assets/placeholder-product.jpg'" class="card-img-top p-4"
                                [alt]="product.name" style="height: 250px; object-fit: contain;">
                            <div class="card-body p-4 d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title fw-bold mb-0">{{ product.name }}</h5>
                                </div>
                                <p class="card-text text-muted small flex-grow-1 text-truncate-2">{{ product.description
                                    }}</p>

                                <div class="d-flex align-items-center justify-content-between mt-3">
                                    <div>
                                        <span class="text-decoration-line-through text-muted small">₹{{ product.mrp
                                            }}</span>
                                        <h5 class="fw-bold text-primary mb-0">₹{{ product.sellingPrice }}</h5>
                                    </div>
                                    <button class="btn btn-dark rounded-circle shadow-sm"
                                        style="width: 40px; height: 40px;" (click)="addToCart(product)">
                                        <i class="fa-solid fa-cart-plus"></i>
                                    </button>
                                </div>

                                <a [routerLink]="['/product', product.productId]"
                                    class="btn btn-outline-primary w-100 mt-3 rounded-pill fw-bold">View Details</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
