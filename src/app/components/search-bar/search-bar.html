<div class="input-group search-bar-group position-relative">
  <input type="text" name="revshop_product_search" autocomplete="off"
    [attr.readonly]="isReadonly ? true : null" (focus)="isReadonly = false; showDropdown = true"
    class="form-control rounded-pill-start search-input" placeholder="Search for products..."
    aria-label="Search products" [(ngModel)]="keyword" (keyup.enter)="onSearch()" />
  <button class="btn btn-warning search-btn rounded-pill-end" type="button" (click)="onSearch()" aria-label="Search">
    <i class="fa-solid fa-search"></i>
  </button>

  <div *ngIf="showDropdown && recentSearches.length > 0" class="dropdown-menu show w-100 shadow mt-1 p-0 border border-secondary bg-body" style="position: absolute; top: 100%; border-radius: 12px; z-index: 1050;">
      <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
          <small class="text-muted fw-bold">Recent Searches</small>
          <small class="text-warning" style="cursor: pointer;" (click)="clearHistory($event)">Clear</small>
      </div>
      <a *ngFor="let term of recentSearches" class="dropdown-item py-2 px-3 text-body border-0 dropdown-hover d-flex align-items-center" style="cursor: pointer;" (click)="selectSearch(term)">
          <i class="fa-solid fa-clock-rotate-left text-muted me-3"></i> {{ term }}
      </a>
  </div>
</div>
